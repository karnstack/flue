<body>
  <figure>
    <img src="/architecture.svg" width="1160" height="584"
      alt="Architecture of flue: on your machine, a browser tab talks to the flue daemon over a loopback websocket. The daemon and your other devices each dial outbound into a relay Worker in your own Cloudflare account; the relay forwards ciphertext it holds no key for. A Noise IK channel runs end to end from the daemon to the remote browser, with the daemon's key pinned at pairing. flue.sh is never part of the data path.">
