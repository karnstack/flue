# goreleaser v2 config. Local validation (see the release-infra plan):
#   goreleaser check                        -> must pass clean
#   goreleaser release --snapshot --clean   -> must fully succeed
version: 2

project_name: flue

before:
  hooks:
    # web/dist must exist before any go build: //go:embed all:dist in
    # web/embed.go does not compile without it. Depend on the Makefile
    # target, never an inline copy of its steps.
    - make web

builds:
  - id: flue
    main: ./cmd/flue
    binary: flue
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    # The asset-name contract shared with scripts/install.sh and the site
    # lane, verbatim: flue_{version}_{os}_{arch}.tar.gz. {{ .Version }} has
    # no leading v; Os is darwin|linux; Arch is amd64|arm64.
    name_template: "flue_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.*\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.*\))?!?:'
      order: 1
    - title: Docs
      regexp: '^docs(\(.*\))?!?:'
      order: 2
    - title: Other
      order: 999

# A cask, not a formula: goreleaser deprecated `brews` in v2.16 (removed in
# v3) because casks are Homebrew's own path for prebuilt binaries. The
# rendered cask carries on_linux stanzas as well — Homebrew installs binary
# casks on Linux since 4.5 — and `brew install karnstack/tap/flue` resolves
# it by name, so the advertised install command is unchanged. install.sh
# remains the no-Homebrew path. No tap_migrations.json is needed in the
# tap: no formula was ever published.
homebrew_casks:
  - name: flue
    repository:
      owner: karnstack
      name: tap
      # User-provided repo secret — the one manual setup step. The default
      # GITHUB_TOKEN cannot push to another repository.
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://flue.sh
    description: "Your terminal, as a browser tab."
    # The release binaries are unsigned and unnotarized, so Gatekeeper
    # quarantines what the cask installs and macOS refuses to run it. This
    # is the hook goreleaser's own docs prescribe until signing lands.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/flue"]
          end
